name: telemetry-free-windows-build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/SHA to build (blank = current ref)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: telemetry-free-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 (telemetry-free)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Electron Forge/Vite is a child Node process spawned by package-desktop.mjs.
      # Keep the heap budget at job scope so the entire Node process tree inherits it.
      NODE_OPTIONS: --max-old-space-size=8192
      # package-desktop.mjs writes artifacts relative to apps/desktop, not repository root.
      # Keep one canonical path so verification and upload cannot drift apart again.
      ARTIFACT_ROOT: apps/desktop/release/artifacts/global/unversioned/win32-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Node heap budget
        shell: pwsh
        run: |
          $heapMiB = node -e "const v8=require('node:v8'); process.stdout.write(String(Math.round(v8.getHeapStatistics().heap_size_limit/1024/1024)))"
          Write-Host "Effective V8 heap limit: $heapMiB MiB"
          if ([int]$heapMiB -lt 7500) {
            throw "NODE_OPTIONS did not propagate correctly; expected >= 7500 MiB heap, got $heapMiB MiB"
          }

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Strip desktop telemetry (fail closed)
        run: node .github/scripts/strip-telemetry.mjs

      - name: Validate telemetry-free patch scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$'apps/desktop/src/main/heartbeatService.ts\napps/desktop/src/renderer/main-entry.tsx'
          actual="$(git diff --name-only | sort)"
          printf 'Changed files after telemetry strip:\n%s\n' "$actual"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Telemetry stripping changed an unexpected file or missed an expected file.' >&2
            exit 1
          fi
          git diff --check
          git diff --stat -- apps/desktop/src/main/heartbeatService.ts apps/desktop/src/renderer/main-entry.tsx
          git diff --unified=3 -- apps/desktop/src/main/heartbeatService.ts apps/desktop/src/renderer/main-entry.tsx

      - name: Typecheck desktop after telemetry stripping
        run: pnpm --filter desktop typecheck

      - name: Package unsigned Windows x64 artifact
        shell: pwsh
        env:
          # electron-builder 24.x implicitly enables onTagOrDraft publishing whenever
          # is-ci reports true. This workflow only builds an Actions artifact; it never
          # publishes a GitHub Release. ci-info/is-ci documents CI=false as the explicit
          # opt-out, and the preflight below verifies that the exact runtime sees it.
          CI: 'false'
        run: |
          $heapMiB = node -e "const v8=require('node:v8'); process.stdout.write(String(Math.round(v8.getHeapStatistics().heap_size_limit/1024/1024)))"
          Write-Host "Packaging V8 heap limit: $heapMiB MiB"
          if ([int]$heapMiB -lt 7500) {
            throw "Packaging heap budget regressed before Electron Forge: $heapMiB MiB"
          }

          $isCi = node -e "process.stdout.write(String(require('is-ci')))"
          Write-Host "electron-builder is-ci detection: $isCi"
          if ($isCi.Trim() -ne 'false') {
            throw "Artifact packaging must not be detected as CI by electron-builder; got is-ci=$isCi"
          }

          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN) {
            throw 'Packaging step must not receive GitHub publish tokens.'
          }

          node scripts/ensure-deps.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Call the packaging script directly instead of forwarding through pnpm's
          # `--` separator, so its argv is unambiguous. Hosted Actions only needs the
          # installer artifact; skip the GUI launch smoke test to avoid desktop-session
          # flakiness unrelated to compilation/package integrity.
          node apps/desktop/scripts/package-desktop.mjs --platform win32 --arch x64 --region global --no-sign --skip-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: pwsh
        run: |
          $artifactRoot = $env:ARTIFACT_ROOT
          Write-Host "Verifying artifact root: $artifactRoot"
          if (-not (Test-Path -LiteralPath $artifactRoot -PathType Container)) {
            throw "Expected artifact directory not found: $artifactRoot"
          }

          $installers = @(Get-ChildItem -LiteralPath $artifactRoot -File -Recurse -Filter '*.exe')
          if ($installers.Count -lt 1) {
            throw "No Windows .exe installer found under $artifactRoot"
          }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) {
              throw "Installer is unexpectedly small/truncated: $($installer.FullName) ($($installer.Length) bytes)"
            }
          }

          $buildInfo = Join-Path $artifactRoot 'build-info.json'
          if (-not (Test-Path -LiteralPath $buildInfo -PathType Leaf)) {
            throw "Expected build metadata not found: $buildInfo"
          }
          Get-Content -Raw -LiteralPath $buildInfo | ConvertFrom-Json | Out-Null

          $installers | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            [PSCustomObject]@{
              Name = $_.Name
              SizeMiB = [math]::Round($_.Length / 1MB, 2)
              SHA256 = $hash.Hash
            }
          } | Format-Table -AutoSize

      - name: Verify source tree after packaging
        shell: bash
        run: |
          set -euo pipefail
          expected=$'apps/desktop/src/main/heartbeatService.ts\napps/desktop/src/renderer/main-entry.tsx'
          actual="$(git diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected tracked changes after packaging:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --check

      - name: Upload telemetry-free build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cindy-telemetry-free-windows-x64-${{ github.run_number }}
          path: ${{ env.ARTIFACT_ROOT }}/**
          if-no-files-found: error
          retention-days: 14
